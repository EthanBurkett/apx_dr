name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      assets:
        description: Hydrate LFS and run all Python asset tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check.py
      - name: Build transaction tests
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\test-build.ps1
  assets:
    if: github.event_name == 'workflow_dispatch' && inputs.assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: git lfs fsck
      - run: python tools/repo_audit.py --assets
      - run: python tools/validate.py --source-only
      - run: python -m unittest discover -s tests -v
