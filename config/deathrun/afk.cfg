// ApX Deathrun / afk

// Enable AFK monitor
set dr_afk 1

// If set to 0 afk player will be killed, if set to 1 player will be kicked from server
set dr_afk_method 0

// Time after AFK player wil receive warning message
set dr_afk_warn 20

// Time after AFK player will be killed or kicked from server
set dr_afk_time 25

