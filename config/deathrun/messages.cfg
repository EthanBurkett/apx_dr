// ApX Deathrun / messages

// Enable messages on server
set dr_messages_enable 1

// Delay between messages
set dr_messages_delay 25

// Messages, you can add as many messages as you want (1024 characters total), separate them with ";"
set dr_messages "Welcome to ^3ApX Deathrun^7;Tune FOV and Fullbright in Settings. Your preferences save.;Choose your character, primary, knife and arms in Loadout.;70 levels. 10 prestiges. Keep running."

// Message displayed during the ApX credits phase
set dr_lastmessage "Thanks for playing ^3ApX Deathrun"

// "Message of the day" (message in menu)
set dr_motd "Welcome to ^3ApX Deathrun^7. Jumpers survive the course; the Activator controls the traps."

