// ApX Deathrun / rules

//Game rules
set g_allowVote 0

// Base movement speed; Jumpers and Activators retain their role multipliers.
set g_speed 210

// Public text chat reaches living players, dead players and spectators.
// Explicit team chat remains team-only; voice chat keeps its own settings.
set g_deadChat 1

// Anti Cheat Settings
set sv_disableClientConsole "0"

set cl_autocmd "0"

set sv_cheats "0"

set sv_pure "1"

set g_banIPs ""

set g_no_script_spam "1"

set sv_punkbuster "1"

