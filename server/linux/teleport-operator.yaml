kind: role
version: v7
metadata:
  name: apx-dr-operator
  description: Recorded root administration of ApX Deathrun servers only
spec:
  allow:
    logins: [root]
    node_labels:
      project: apx-dr
      service: apx-dr
  options:
    max_session_ttl: 12h
    forward_agent: false
    ssh_file_copy: true
    enhanced_recording: [command, network]
    record_session:
      default: strict
